global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: sentinelstream-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingestion-service:8001
          - feature-service:8002
          - rule-engine:8003
          - model-service:8004
          - decision-service:8005
          - feedback-service:8006
          - analyst-console:8007

  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
