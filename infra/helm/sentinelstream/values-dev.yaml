global:
  environment: dev
  imagePullPolicy: IfNotPresent

config:
  postgres:
    host: sentinelstream-dev-postgres.sentinelstream-data.svc.cluster.local
    port: 5432
    database: sentinelstream
    user: sentinel
  kafkaBootstrapServers: sentinelstream-dev-redpanda.sentinelstream-data.svc.cluster.local:9092

ingress:
  enabled: false
  host: sentinelstream.dev.internal

services:
  ingestion-service:
    replicas: 2
  feature-service:
    replicas: 2
  rule-engine:
    replicas: 2
  model-service:
    replicas: 2
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 750m
        memory: 768Mi
  decision-service:
    replicas: 3
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 768Mi
  feedback-service:
    replicas: 2
  analyst-console:
    replicas: 2
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
