global:
  environment: prod
  imagePullPolicy: IfNotPresent
  logLevel: INFO

config:
  postgres:
    host: sentinelstream-prod-postgres.sentinelstream-data.svc.cluster.local
    port: 5432
    database: sentinelstream
    user: sentinel
  kafkaBootstrapServers: sentinelstream-prod-redpanda.sentinelstream-data.svc.cluster.local:9092
  modelTimeoutMs: 35
  featureTimeoutMs: 25
  ruleTimeoutMs: 15

ingress:
  enabled: false
  host: sentinelstream.prod.internal

serviceDefaults:
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi

services:
  ingestion-service:
    replicas: 3
  feature-service:
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 2
  rule-engine:
    replicas: 3
  model-service:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 2
  decision-service:
    replicas: 4
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 4
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      minAvailable: 2
  feedback-service:
    replicas: 3
  analyst-console:
    replicas: 2
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
