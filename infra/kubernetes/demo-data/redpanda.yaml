apiVersion: v1
kind: Service
metadata:
  name: sentinelstream-dev-redpanda
spec:
  selector:
    app: sentinelstream-dev-redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: rpc
      port: 33145
      targetPort: 33145
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelstream-dev-redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelstream-dev-redpanda
  template:
    metadata:
      labels:
        app: sentinelstream-dev-redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.10
          imagePullPolicy: IfNotPresent
          args:
            - redpanda
            - start
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://sentinelstream-dev-redpanda.sentinelstream-data.svc.cluster.local:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - sentinelstream-dev-redpanda.sentinelstream-data.svc.cluster.local:33145
            - --mode
            - dev-container
            - --smp
            - "1"
            - --default-log-level=info
            - --set
            - redpanda.auto_create_topics_enabled=true
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 33145
              name: rpc
            - containerPort: 9644
              name: admin
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
