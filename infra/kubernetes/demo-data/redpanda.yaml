apiVersion: v1
kind: Service
metadata:
  name: sentinelstream-dev-redpanda
spec:
  selector:
    app: sentinelstream-dev-redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelstream-dev-redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelstream-dev-redpanda
  template:
    metadata:
      labels:
        app: sentinelstream-dev-redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.10
          imagePullPolicy: IfNotPresent
          command:
            - redpanda
            - start
            - --smp
            - "1"
            - --memory
            - 1G
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://sentinelstream-dev-redpanda.sentinelstream-data.svc.cluster.local:9092
            - --set
            - redpanda.auto_create_topics_enabled=true
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9644
              name: admin
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
