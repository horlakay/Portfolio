[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelstream"
version = "0.1.0"
description = "Real-time fraud and account takeover defense platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.13.0,<1.0.0",
  "asyncpg>=0.31.0,<0.32.0",
  "fastapi>=0.135.3,<0.136.0",
  "httpx>=0.27.0,<0.28.0",
  "jinja2>=3.1.4,<4.0.0",
  "joblib>=1.4.2,<2.0.0",
  "numpy>=2.2.0,<3.0.0",
  "pandas>=2.3.0,<3.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-multipart>=0.0.9,<0.1.0",
  "PyJWT>=2.9.0,<3.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "redis>=5.0.8,<6.0.0",
  "scikit-learn>=1.7.0,<2.0.0",
  "slowapi>=0.1.9,<0.2.0",
  "sqlalchemy>=2.0.32,<3.0.0",
  "starlette>=0.49.1,<0.50.0",
  "structlog>=24.4.0,<25.0.0",
  "tenacity>=8.5.0,<9.0.0",
  "uvicorn[standard]>=0.30.6,<0.31.0",
  "opentelemetry-api>=1.27.0,<2.0.0",
  "opentelemetry-sdk>=1.27.0,<2.0.0",
  "opentelemetry-exporter-otlp>=1.27.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0.0",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "faker>=28.0.0,<29.0.0",
  "locust>=2.31.1,<3.0.0",
  "mypy>=1.11.1,<2.0.0",
  "python-hcl2>=6.1.0,<8.0.0",
  "pytest>=8.3.2,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "ruff>=0.6.1,<0.7.0",
  "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.setuptools.packages.find]
where = [
  "shared/src",
  "services/ingestion-service/src",
  "services/feature-service/src",
  "services/rule-engine/src",
  "services/model-service/src",
  "services/decision-service/src",
  "services/feedback-service/src",
  "services/analyst-console/src",
  "training",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"services/decision-service/src/decision_service/main.py" = ["B008"]
"services/feature-service/src/feature_service/main.py" = ["B008"]
"services/feedback-service/src/feedback_service/main.py" = ["B008"]
"services/ingestion-service/src/ingestion_service/main.py" = ["B008"]
"services/rule-engine/src/rule_engine/main.py" = ["N802"]
"shared/src/sentinel_shared/auth/jwt.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["arg-type", "union-attr", "var-annotated"]
