<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SentinelStream Analyst Login</title>
    <style>
      body { font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { width: min(420px, 92vw); background: rgba(15,23,42,.85); padding: 2rem; border-radius: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
      h1 { margin-top: 0; font-size: 1.75rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, select, button { width: 100%; padding: .85rem 1rem; border-radius: 12px; border: 1px solid #334155; margin-top: .4rem; background: #0b1120; color: #e2e8f0; }
      button { background: #0891b2; border: none; font-weight: 700; cursor: pointer; margin-top: 1.5rem; }
      .error { color: #fca5a5; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/login">
      <h1>SentinelStream</h1>
      <p>Internal fraud operations console</p>
      <label>Username <input name="username" required /></label>
      <label>Password <input type="password" name="password" required /></label>
      <label>Role
        <select name="role">
          <option value="analyst">Analyst</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <button type="submit">Access Console</button>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </form>
  </body>
</html>
