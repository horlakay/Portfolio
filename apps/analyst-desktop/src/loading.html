<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelStream Analyst Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e6edf7;
        --muted: #90a0b8;
        --panel: rgba(8, 18, 36, 0.86);
        --line: rgba(109, 142, 188, 0.26);
        --accent: #5dd6ff;
        --accent-2: #69f0ae;
        --bg-1: #07111f;
        --bg-2: #10233e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Aptos, "Segoe UI Variable", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, rgba(93, 214, 255, 0.12), transparent 28%),
          radial-gradient(circle at 80% 15%, rgba(105, 240, 174, 0.14), transparent 22%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .shell {
        width: min(760px, calc(100vw - 48px));
        padding: 36px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(22px);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
      }

      .hero {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }

      .mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: rgba(93, 214, 255, 0.09);
        border: 1px solid rgba(93, 214, 255, 0.18);
        display: grid;
        place-items: center;
      }

      .mark img {
        width: 40px;
        height: 40px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--accent);
        font-size: 0.92rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pulse {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(93, 214, 255, 0.7);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(93, 214, 255, 0.55); }
        70% { box-shadow: 0 0 0 18px rgba(93, 214, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(93, 214, 255, 0); }
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.1rem, 4vw, 3.35rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .details {
        display: grid;
        gap: 14px;
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }

      .label {
        color: var(--muted);
      }

      code {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(93, 214, 255, 0.08);
        color: var(--ink);
        font-family: Consolas, "Cascadia Mono", monospace;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="mark">
          <img src="./brand-mark.svg" alt="SentinelStream mark" />
        </div>
        <div>
          <div class="eyebrow"><span class="pulse"></span> Analyst Workbench Launch</div>
          <h1>Bringing SentinelStream online</h1>
        </div>
      </section>
      <p>
        The desktop shell is waiting for the analyst console to answer its readiness
        probe before switching into the live investigation workspace.
      </p>

      <section class="details">
        <div class="row">
          <span class="label">Connection mode</span>
          <code id="mode"></code>
        </div>
        <div class="row">
          <span class="label">Target console</span>
          <code id="target-url"></code>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("mode").textContent = params.get("mode") || "external";
      document.getElementById("target-url").textContent =
        params.get("targetUrl") || "http://127.0.0.1:8007";
    </script>
  </body>
</html>
