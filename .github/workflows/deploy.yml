name: Deploy Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        service:
          - ingestion-service
          - feature-service
          - rule-engine
          - model-service
          - decision-service
          - feedback-service
          - analyst-console
    steps:
      - name: Preflight deploy config
        id: preflight
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -n "${ECR_REGISTRY}" && -n "${AWS_DEPLOY_ROLE_ARN}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Bootstrap model artifacts
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m training.pipelines.bootstrap_models --rows 12000 --seed 42
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - uses: docker/setup-buildx-action@v3
        if: steps.preflight.outputs.ready == 'true'
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.preflight.outputs.ready == 'true'
      - uses: docker/build-push-action@v6
        if: steps.preflight.outputs.ready == 'true'
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/sentinelstream/${{ matrix.service }}:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/sentinelstream/${{ matrix.service }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan pushed image
        if: steps.preflight.outputs.ready == 'true'
        run: |
          docker run --rm \
            -v "${HOME}/.docker:/root/.docker:ro" \
            aquasec/trivy:0.65.0 \
            image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "${{ vars.ECR_REGISTRY }}/sentinelstream/${{ matrix.service }}:${{ github.sha }}"
      - name: Skip build when deploy config is absent
        if: steps.preflight.outputs.ready != 'true'
        run: echo "Skipping image build because the dev environment is missing ECR or AWS deploy credentials."

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'sentinelstream' }}
      RELEASE_NAME: sentinelstream
    steps:
      - name: Preflight deployment config
        id: preflight
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANALYST_CONSOLE_PASSWORD: ${{ secrets.ANALYST_CONSOLE_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [[ -n "${ECR_REGISTRY}" && -n "${EKS_CLUSTER_NAME}" && -n "${POSTGRES_HOST}" && -n "${KAFKA_BOOTSTRAP_SERVERS}" && -n "${AWS_DEPLOY_ROLE_ARN}" && -n "${JWT_SECRET}" && -n "${ANALYST_CONSOLE_PASSWORD}" && -n "${POSTGRES_PASSWORD}" && -n "${REDIS_URL}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          version: "v3.15.4"
      - uses: azure/setup-kubectl@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          version: "v1.30.0"
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install benchmark dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Update kubeconfig
        if: steps.preflight.outputs.ready == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${AWS_REGION}"
      - name: Create namespace and application secret
        if: steps.preflight.outputs.ready == 'true'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANALYST_CONSOLE_PASSWORD: ${{ secrets.ANALYST_CONSOLE_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          kubectl create namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${KUBE_NAMESPACE}" create secret generic sentinelstream-secrets \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=ANALYST_CONSOLE_PASSWORD="${ANALYST_CONSOLE_PASSWORD}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=REDIS_URL="${REDIS_URL}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        run: |
          helm upgrade --install "${RELEASE_NAME}" infra/helm/sentinelstream \
            --namespace "${KUBE_NAMESPACE}" \
            --create-namespace \
            --values infra/helm/sentinelstream/values-dev.yaml \
            --set-string global.imageRegistry="${{ vars.ECR_REGISTRY }}/sentinelstream" \
            --set-string global.imageTag="${{ github.sha }}" \
            --set-string secrets.rolloutChecksum="${{ github.run_id }}" \
            --set-string config.postgres.host="${{ vars.POSTGRES_HOST }}" \
            --set-string config.postgres.port="${{ vars.POSTGRES_PORT || '5432' }}" \
            --set-string config.postgres.database="${{ vars.POSTGRES_DB || 'sentinelstream' }}" \
            --set-string config.postgres.user="${{ vars.POSTGRES_USER || 'sentinel' }}" \
            --set-string config.kafkaBootstrapServers="${{ vars.KAFKA_BOOTSTRAP_SERVERS }}" \
            --history-max 10 \
            --debug \
            --wait \
            --timeout 15m
      - name: Verify rollouts
        if: steps.preflight.outputs.ready == 'true'
        run: |
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/sentinelstream-ingestion-service --timeout=5m
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/sentinelstream-feature-service --timeout=5m
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/sentinelstream-rule-engine --timeout=5m
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/sentinelstream-model-service --timeout=5m
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/sentinelstream-decision-service --timeout=5m
      - name: Smoke test and benchmark
        if: steps.preflight.outputs.ready == 'true'
        run: |
          kubectl -n "${KUBE_NAMESPACE}" port-forward svc/sentinelstream-decision-service 18005:8005 > decision-port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap "kill ${PORT_FORWARD_PID}" EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18005/health/ready; then
              break
            fi
            sleep 5
          done
          BENCHMARK_RUNS=25 DECISION_SERVICE_URL=http://127.0.0.1:18005 python tests/load/benchmark_driver.py
      - name: Upload benchmark report
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decision-benchmark-${{ github.sha }}
          path: tests/load/results/latest_benchmark.json
      - name: Append deployment summary
        if: steps.preflight.outputs.ready == 'true'
        run: |
          echo "## Dev deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release: ${RELEASE_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Namespace: ${KUBE_NAMESPACE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image tag: ${{ github.sha }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Decision benchmark" >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          cat tests/load/results/latest_benchmark.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Collect failure diagnostics
        if: failure() && steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          echo "### Namespace snapshot"
          kubectl get all -n "${KUBE_NAMESPACE}" -o wide || true
          echo "### Recent events"
          kubectl get events -n "${KUBE_NAMESPACE}" --sort-by=.metadata.creationTimestamp || true
          for pod in $(kubectl get pods -n "${KUBE_NAMESPACE}" -o name 2>/dev/null); do
            echo "::group::describe ${pod}"
            kubectl describe -n "${KUBE_NAMESPACE}" "${pod}" || true
            echo "::endgroup::"
            echo "::group::logs ${pod}"
            kubectl logs -n "${KUBE_NAMESPACE}" "${pod#pod/}" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
          echo "### Demo data namespace snapshot"
          kubectl get all -n sentinelstream-data -o wide || true
          echo "### Demo data recent events"
          kubectl get events -n sentinelstream-data --sort-by=.metadata.creationTimestamp || true
          for workload in deployment/sentinelstream-dev-postgres deployment/sentinelstream-dev-redpanda deployment/sentinelstream-redis; do
            echo "::group::describe ${workload}"
            kubectl describe -n sentinelstream-data "${workload}" || true
            echo "::endgroup::"
            echo "::group::logs ${workload}"
            kubectl logs -n sentinelstream-data "${workload}" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
      - name: Skip deploy when environment config is absent
        if: steps.preflight.outputs.ready != 'true'
        run: echo "Skipping dev deploy because required environment variables or secrets are not configured yet."
