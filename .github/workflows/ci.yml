name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Compile
        run: python -m compileall shared/src services training scripts tests

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Delivery validation
        run: python scripts/validate_delivery.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pip-audit
      - name: Python dependency audit
        run: pip-audit --progress-spinner off
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "${HOME}/.local/bin" v0.65.0
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            .
